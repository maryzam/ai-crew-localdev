receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/phoenix:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["openinference.project.name"], attributes["ai.project"])
      - context: span
        statements:
          - set(attributes["openinference.span.kind"], "AGENT") where attributes["openinference.span.kind"] == nil
  batch:
    timeout: 1s
    send_batch_size: 128

exporters:
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
    timeout: 1s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 512

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/phoenix, batch]
      exporters: [otlp/phoenix]
