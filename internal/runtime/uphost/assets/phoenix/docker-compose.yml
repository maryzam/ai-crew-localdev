services:
  phoenix:
    image: arizephoenix/phoenix:version-20.23.0@sha256:c542e7de1dc1fdd0f938de337d44ebefa7266e91391eed6e7978523d7f6e1f2f
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /data
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/collector.yaml"]
    depends_on:
      phoenix:
        condition: service_healthy
    ports:
      - "127.0.0.1:4319:4318"
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/collector.yaml:ro

volumes:
  phoenix-data:
