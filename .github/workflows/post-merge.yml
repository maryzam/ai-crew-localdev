name: Post-Merge Smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: make build

      - name: Install OCI 1.2.0-compatible crun
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/containers/crun/releases/latest | jq -r .tag_name)"
          echo "installing crun ${tag} to match the runner's buildah OCI runtime spec"
          curl -fsSL -o /tmp/crun "https://github.com/containers/crun/releases/download/${tag}/crun-${tag}-linux-amd64"
          sudo install -m 0755 /tmp/crun /usr/bin/crun
          crun --version

      - name: Check Podman
        run: podman info

      - name: Podman readiness smoke (make readiness)
        run: make readiness

      - name: Login persistence smoke (make readiness-login)
        run: make readiness-login

      - name: Clean-host journey (make journey)
        run: make journey

      - name: Integration test compilation
        run: go vet -tags integration ./test/e2e/
